<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Square logo - dark green bg with white/green design -->
  <rect width="400" height="400" rx="40" fill="#0a2416"/>
  
  <!-- Outer glow ring -->
  <circle cx="200" cy="165" r="95" fill="none" stroke="#6ee9a0" stroke-width="3" opacity="0.3"/>
  
  <!-- Shield shape -->
  <path d="M200 75 L280 110 L280 185 Q280 240 200 270 Q120 240 120 185 L120 110 Z" fill="#1a5c3a" stroke="#6ee9a0" stroke-width="2.5"/>
  
  <!-- Crown inside shield -->
  <path d="M200 120 L172 145 L158 132 L163 162 L237 162 L242 132 L228 145 Z" fill="#fff"/>
  <rect x="163" y="162" width="74" height="16" rx="4" fill="#fff"/>
  
  <!-- Crown gems -->
  <circle cx="200" cy="142" r="6" fill="#6ee9a0"/>
  <circle cx="172" cy="150" r="4" fill="#6ee9a0" opacity="0.8"/>
  <circle cx="228" cy="150" r="4" fill="#6ee9a0" opacity="0.8"/>

  <!-- NO text below shield -->
  <text x="200" y="310" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="38" font-weight="900" fill="#fff" letter-spacing="6">NON</text>
  <text x="200" y="355" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" font-weight="700" fill="#6ee9a0" letter-spacing="3">GAMSTOP</text>
</svg>
